---
# Instalação e habilitação do RKE2 (single-node, control-plane + worker) via scripts oficiais do RKE2.
# Idempotente: se já estiver instalado, os passos de instalação serão ignorados.

# Relógio dessincronizado quebra a instalação do RKE2 (validação TLS ao
# baixar o instalador, e o subscription-manager em VMs RHEL-based também
# reclama). Garantir isso logo no início evita falha silenciosa mais na
# frente.
- name: Instalar chrony (sincronização de horário)
  ansible.builtin.package:
    name: chrony
    state: present

- name: Habilitar e iniciar o chronyd
  ansible.builtin.systemd:
    name: chronyd
    enabled: true
    state: started

- name: Forçar sincronização imediata do relógio
  ansible.builtin.command: chronyc makestep
  changed_when: false

- name: Verificar se o RKE2 já está instalado
  ansible.builtin.stat:
    path: /usr/local/bin/rke2
  register: rke2_binary

# Instalador oficial do RKE2, distribuído como script (curl | sh); não há
# módulo Ansible equivalente para isso.
- name: Baixar e executar o instalador oficial do RKE2 # noqa: command-instead-of-module
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.rke2.io | \
    INSTALL_RKE2_TYPE={{ rke2_type }} \
    {{ ('INSTALL_RKE2_VERSION=' + rke2_version) if rke2_version else '' }} \
    sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/rke2
  when: not rke2_binary.stat.exists

- name: Habilitar e iniciar o serviço rke2-server
  ansible.builtin.systemd:
    name: rke2-server
    enabled: true
    state: started
  register: rke2_service

- name: Aguardar o kubeconfig ser gerado pelo RKE2
  ansible.builtin.wait_for:
    path: /etc/rancher/rke2/rke2.yaml
    timeout: 180

- name: Criar symlink do kubectl
  ansible.builtin.file:
    src: "{{ rke2_bin_dir }}/kubectl"
    dest: /usr/local/bin/kubectl
    state: link
  when: rke2_create_kubectl_symlink

- name: Ajustar permissões do kubeconfig para leitura pelo usuário de serviço
  ansible.builtin.file:
    path: /etc/rancher/rke2/rke2.yaml
    mode: "0640"
    group: "{{ ansible_user }}"

- name: Aguardar o node ficar em estado Ready
  ansible.builtin.shell: |
    set -o pipefail
    KUBECONFIG=/etc/rancher/rke2/rke2.yaml /usr/local/bin/kubectl get nodes --no-headers | awk '{print $2}'
  args:
    executable: /bin/bash
  register: rke2_node_status
  until: rke2_node_status.stdout.find('Ready') != -1
  retries: 30
  delay: 10
  changed_when: false

- name: Exibir status final do node
  ansible.builtin.debug:
    msg: "RKE2 instalado e node em estado: {{ rke2_node_status.stdout }}"
