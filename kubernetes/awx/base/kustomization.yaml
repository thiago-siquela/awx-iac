apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Apenas o awx-operator. A Custom Resource (awx-instance.yaml) é aplicada à
# parte, depois do CRD do AWX ficar "Established" — evita a corrida entre a
# criação do CRD e a validação da CR quando os dois vão no mesmo apply.
resources:
  - github.com/ansible/awx-operator/config/default?ref=2.19.1

images:
  - name: quay.io/ansible/awx-operator
    newTag: 2.19.1

namespace: awx
